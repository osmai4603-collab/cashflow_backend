services:
  postgres:
    image: postgres:16-alpine
    container_name: cashflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-cashflow}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cashflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cashflow_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cashflow_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8070
      STORAGE_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-cashflow}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_NAME: odoo_go_backend
      APP_VERSION: 0.1.0
      COMPANY_MODE: single
      MANAGEMENT_ENABLED: "true"
      MANAGEMENT_INTERFACE: 0.0.0.0
      MANAGEMENT_PORT: "8066"
      MANAGEMENT_PPROF_ENABLED: "false"
      MANAGEMENT_REQUIRE_AUTH: "true"
      MANAGEMENT_AUTH_TOKEN: ${MANAGEMENT_AUTH_TOKEN:-change-me}
    ports:
      - "${PORT:-8070}:8070"
      # Management is published on loopback ONLY: 127.0.0.1:8066 -> container 8066.
      # From the host, Prometheus/Grafana reach it at http://127.0.0.1:8066/metrics.
      # Since compose binds 0.0.0.0 inside the container, auth is mandatory there.
      - "127.0.0.1:${MANAGEMENT_PORT:-8066}:8066"

volumes:
  postgres_data:
  redis_data:

networks:
  # Named explicitly so docker-compose.monitoring.yml can join the same network
  # to scrape http://server:8066/metrics from inside the stack.
  default:
    name: cashflow-monitoring-net
