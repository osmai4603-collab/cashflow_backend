# Alertmanager configuration for the Cashflow monitoring stack.
#
# Notifications go to a webhook. The URL is injected from the environment at
# load time (ALERTMANAGER_WEBHOOK_URL). Set it to your webhook sink
# (Slack/Teams/PagerDuty-style endpoint or an internal dispatcher). If it is
# left at the placeholder default, Alertmanager keeps running (UI/API at
# 127.0.0.1:9093 show the alerts) but deliveries to the unreachable sink
# simply fail and are retried.
route:
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: webhook
receivers:
  - name: webhook
    webhook_configs:
      - url: ${ALERTMANAGER_WEBHOOK_URL}
        send_resolved: true