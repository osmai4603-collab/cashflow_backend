# Prometheus scrape configuration for the Cashflow backend stack.
#
# The management listener is bound to 0.0.0.0 inside its container (so that
# other containers can reach it) and REQUIRES auth in that posture, therefore
# every scrape carries the Bearer token from MANAGEMENT_AUTH_TOKEN.
#
# ${MANAGEMENT_AUTH_TOKEN} is expanded by Prometheus at load time (env var
# reference). If it is empty/absent the scrape is rejected with 401 by design.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/cashflow-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: cashflow
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials: ${MANAGEMENT_AUTH_TOKEN}
    static_configs:
      - targets: ["server:8066"]
        labels:
          environment: "dev"